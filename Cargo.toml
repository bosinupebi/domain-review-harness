[package]
name = "domain-review-harness"
version = "0.1.0"
edition = "2024"
description = "Free domain security and website trust review harness"
license = "MIT"
repository = "https://github.com/bosinupebi/domain-review-harness"
readme = "README.md"
keywords = ["security", "domain", "audit", "self-hosted"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "domain-review"
path = "src/main.rs"

[dependencies]
roxmltree = "0.20"
tiny_http = "0.12"
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
html-escape = "0.2"
libc = "0.2"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.20"
